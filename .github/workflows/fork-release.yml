name: Build & Release Fork

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.24.2)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag name
        id: get_tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.0.0-dev"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: OpenChamber ${{ steps.get_tag.outputs.tag }} (Custom Quota Hook)
          draft: false
          prerelease: false
          body: |
            Automated release for **${{ steps.get_tag.outputs.tag }}** with Custom Quota Provider Hook.

            - **Upstream Release**: https://github.com/openchamber/openchamber/releases/tag/${{ steps.get_tag.outputs.tag }}
            - **Custom Quota Documentation**: [中文扩展说明 (Chinese Guide)](https://github.com/wx2020/openchamber/blob/main/docs/CUSTOM_QUOTA_PROVIDERS.zh-CN.md)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web-and-vscode:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Package Web tarball
        run: bun pm pack --cwd packages/web

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          bun run build
          bunx vsce package --no-dependencies || true

      - name: Upload Web & VS Code Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            packages/web/*.tgz
            packages/vscode/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-windows:
    needs: create-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows Desktop App
        working-directory: packages/electron
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          bunx electron-builder --win --x64 --publish=never

      - name: Upload Windows Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            packages/electron/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux Desktop App
        working-directory: packages/electron
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          bunx electron-builder --linux --x64 --publish=never

      - name: Upload Linux Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            packages/electron/dist/*.AppImage
            packages/electron/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate AOSP Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android Release APK
        env:
          OPENCHAMBER_ANDROID_VERSION_NAME: ${{ needs.create-release.outputs.version }}
          OPENCHAMBER_ANDROID_VERSION_CODE: ${{ github.run_number }}
          OPENCHAMBER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
          OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD: android
          OPENCHAMBER_ANDROID_KEY_ALIAS: androiddebugkey
          OPENCHAMBER_ANDROID_KEY_PASSWORD: android
        run: |
          bun run mobile:sync
          chmod +x ./packages/mobile/android/gradlew
          ./packages/mobile/android/gradlew -p packages/mobile/android assembleRelease
          mkdir -p artifacts
          cp packages/mobile/android/app/build/outputs/apk/release/*.apk "artifacts/OpenChamber-${{ needs.create-release.outputs.version }}-android.apk"

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
